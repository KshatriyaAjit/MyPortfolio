<svg xmlns="http://www.w3.org/2000/svg" width="177" height="145" viewBox="0 0 177 145" fill="none">
  <title>Job search icon</title>
  <desc>A colorful browser window with a job listing, magnifying glass, and small teal cursor accent.</desc>
  <g stroke="#171717" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Browser window -->
    <rect x="50" y="37" width="78" height="59" rx="2.5" fill="#FFB943"/>
    <path d="M50 46V39.8C50 38.3 51.2 37 52.8 37H125.2C126.7 37 128 38.3 128 39.8V46H50Z" fill="#DDF7F4"/>
    <path d="M50 46H128"/>
    <circle cx="55.5" cy="41.5" r="1.2" fill="#fff" stroke-width="1.4"/>
    <circle cx="61" cy="41.5" r="1.2" fill="#fff" stroke-width="1.4"/>
    <circle cx="66.5" cy="41.5" r="1.2" fill="#fff" stroke-width="1.4"/>
    <!-- Job content -->
    <path d="M58 54H91" stroke-width="1.7"/>
    <text x="57" y="65" fill="#171717" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing=".3">JOB</text>
    <path d="M59 78H72M59 83H77M59 88H69" stroke-width="2.5"/>
    <path d="M104 54H119M104 60H119" stroke-width="1.8"/>
    <path d="M120 69V73" stroke-width="2"/>
    <!-- Magnifying glass -->
    <circle cx="97" cy="88" r="19" fill="#69CFE2"/>
    <circle cx="97" cy="88" r="13.5" fill="#FFE0A0"/>
    <circle cx="97" cy="88" r="10.5" fill="#9CE4EE" stroke-width="1.8"/>
    <path d="M111 102L120 111" stroke="#171717" stroke-width="7"/>
    <path d="M111 102L120 111" stroke="#27C6B7" stroke-width="4.2"/>
    <!-- Small cursor / check accent -->
    <path d="M116 108L113.7 115.8L118 114.2L120.5 118.5L123.2 116.7L120.7 112.6L125 111.6L116 108Z" fill="#54D8BD"/>
    <path d="M116 108L113.7 115.8L118 114.2L120.5 118.5L123.2 116.7L120.7 112.6L125 111.6L116 108Z" stroke-width="1.7"/>
  </g>
